$schema: https://raw.githubusercontent.com/oyvindberg/bleep/master/schema.json
$version: 0.0.14
jvm:
  name: graalvm-java17:22.3.1
projects:
  git-wt:
    dependencies:
    - com.lihaoyi::os-lib:0.11.6
    - dev.zio::zio-cli:0.7.5
    extends: template-common
    platform:
      mainClass: GitWt
  gitAutoReword:
    dependencies:
    - com.lihaoyi::os-lib:0.11.6
    - com.monovore::decline:2.5.0
    dependsOn: gitCommitMessageGenerator
    extends: template-common
    platform:
      mainClass: GitAutoReword
  gitCommitMessageGenerator:
    dependencies:
    - com.lihaoyi::os-lib:0.11.6
    - com.lihaoyi::requests:0.9.2
    - com.lihaoyi::upickle:4.4.2
    - com.typesafe:config:1.4.3
    extends: template-common
  gitCommitMessage:
    dependencies:
    - com.lihaoyi::os-lib:0.11.6
    - com.monovore::decline:2.5.0
    dependsOn: gitCommitMessageGenerator
    extends: template-common
    platform:
      mainClass: GitCommitMessage
  testIndex:
    dependencies:
    - com.googlecode.lanterna:lanterna:3.2.0-alpha1
    - com.lihaoyi::fansi:0.5.1
    - com.lihaoyi::os-lib:0.11.6
    - com.olvind.tui::tui:0.0.7
    - dev.zio::zio-streams:2.1.24
    extends: template-common
    platform:
      mainClass: testIndex
templates:
  template-common:
    platform:
      name: jvm
    scala:
      options: -encoding utf8 -feature -rewrite -source:3.4-migration -unchecked
      strict: true
      version: 3.7.1
